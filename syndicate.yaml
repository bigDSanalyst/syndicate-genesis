syndicate:
  name: "CHANGE-ME"
  formed: "YYYY-MM-DD"
  oracle_ref: "template"   # replaced by genesis.sig at provisioning

template:   # lineage. bootstrap.sh records the upstream head at activation;
            # tools/drift_check.py diffs it against upstream and the diff IS
            # the remediation checklist. Instances inherit machinery and rules,
            # never narrative - FINDINGS.md, ROADMAP.md and docs/ are stripped
            # at activation and live on in the template repo.
  repo: "bigDSanalyst/syndicate-genesis"
  ref: "main"
  commit: "RECORD-AT-ACTIVATION"
  recorded: ""

members:   # ONE ROW PER MEMBER, EDIT AT GENESIS
  - name: "Full Name"
    github: "github-handle"
    orcid: "0000-0000-0000-0000"
    email: "ID+handle@users.noreply.github.com"   # see README: finding your noreply address
    role: "theory"
    trust_tier: verified
    joined: "YYYY-MM-DD"
    keys: []   # your SSH signing public key line(s), e.g.
               # "ssh-ed25519 AAAAC3Nza... you@example.com". A key is possession;
               # an email is a claim anyone can type. Adding or rotating one is a
               # manifest PR through the gate - that review IS the trust decision.

governance:
  # formation: how many people this syndicate runs with. `solo` is supported and
  # MUST be declared. A one-member manifest without it is the shape that
  # deadlocks - a review gate nobody else can satisfy (rows 9 and 53) - and it
  # looks identical to a two-person syndicate whose second member never arrived,
  # so the guard refuses it rather than letting the first gated PR discover it.
  # Sticky: adding the second member clears it in the same PR, and join.py does
  # that for you. See README, "Running solo".
  formation: multi        # multi | solo
  # The date this syndicate started signing commits. Commits before it are not
  # checked; member commits after it must carry a signature by a key this
  # manifest lists for their author. Required, not defaulted: every repo adopting
  # signing has unsigned history behind it, including the first commit GitHub
  # makes when you generate from this template and signs with its own key.
  signing_since: "YYYY-MM-DD"
  decision_rule: "majority"
  objection_window_days: 7
  review_gates:   # NOTE: cap at max(members-1, 1). A gate above members-1 deadlocks;
                # a gate of 0 is not a fix - it removes review entirely, and
                # Agreement 10.1 needs at least one approving review to exist.
    "vault/40-drafts/**": 1
    "ledger/**": 1
    "agreements/**": 1

attribution:
  clock: "push-webhook"   # v1 tooling uses committer dates; see attribution.py docstring
  weights: {churn: 0.35, review: 0.25, prompts: 0.20, breadth: 0.20}
  exclude_authors_matching:
    - '\[bot\]$'
    - "ingest-bot@users.noreply.github.com$"
    - "anchor-bot@users.noreply.github.com$"

exit:
  default_split: "per-ledger"
  # Zenodo first, deliberately: it is the route with no institutional gate.
  # arXiv requires endorsement for a first submission in a category, which a
  # syndicate of unaffiliated members may hold from nobody - see docs/PUBLICATION.md.
  archive_targets: [zenodo, arxiv]
