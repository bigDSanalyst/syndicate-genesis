name: ingest-arxiv
on:
  # TEMPLATE MODE: no schedules — a template is the mold, not a syndicate.
  #
  # DO NOT ADD A SCHEDULE HERE. arXiv returns HTTP 406 to GitHub Actions'
  # Azure egress, so a scheduled run on a hosted runner fails every morning
  # and teaches everyone to ignore a red check (ledger row 51). Dispatch it
  # manually to confirm that for yourself; run the real thing from an egress
  # arXiv accepts. anchor.yml has no such problem.
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: repo-write, cancel-in-progress: false}
jobs:
  arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: python tools/ingest_arxiv.py --config agents/queries.yaml --out vault/10-literature
      - name: sync with any human pushes
        run: |
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
      - name: commit
        run: |
          git config user.name  "syndicate-ingest[bot]"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add vault/
          git diff --cached --quiet || (git commit -m "ingest: arXiv $(date -u +%F)"
          for i in 1 2 3; do git push origin "HEAD:${{ github.ref_name }}" && exit 0; git fetch origin "${{ github.ref_name }}" && git rebase "origin/${{ github.ref_name }}"; sleep 2; done; exit 1)
