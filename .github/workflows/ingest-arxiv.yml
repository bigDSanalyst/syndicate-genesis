name: ingest-arxiv
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: repo-write, cancel-in-progress: false}
jobs:
  arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - run: python tools/ingest_arxiv.py --config agents/queries.yaml --out vault/10-literature
      - name: sync with any human pushes
        run: |
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
      - name: commit
        run: |
          git config user.name  "syndicate-ingest[bot]"
          git config user.email "ingest-bot@users.noreply.github.com"
          git add vault/
          git diff --cached --quiet || (git commit -m "ingest: arXiv $(date -u +%F)"
          for i in 1 2 3; do git push origin "HEAD:${{ github.ref_name }}" && exit 0; git fetch origin "${{ github.ref_name }}" && git rebase "origin/${{ github.ref_name }}"; sleep 2; done; exit 1)
