# Generation smoke test. Runs on push and PR only - never on a schedule.
# Operator rule #10 bars syndicate pipelines from firing inside the template;
# a test that proves the mold works is not a syndicate pipeline.
name: smoke
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  generate-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt -r tests/requirements.txt
      # tests/ is both suites: the generation smoke test (can a syndicate be
      # generated and can every tool run against it) and the fault matrix
      # (does any tool exit 0 when the thing it depends on is broken). One
      # invocation, because a separate step would run the shared fixtures
      # twice for no added signal.
      - name: generate a syndicate, run every tool, then break the world
        run: python -m pytest tests/ -q
