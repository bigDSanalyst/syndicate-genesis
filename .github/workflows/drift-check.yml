name: drift-check
on:
  # TEMPLATE MODE: no schedules — a template is the mold, not a syndicate,
  # and a mold has no lineage to drift from (row 12). drift_check.py refuses
  # to run here anyway, on the same placeholder-member marker anchor.py uses.
  #
  # An activated syndicate may add a schedule: this job only reads the GitHub
  # API and writes nothing, so a weekly `cron` is safe where ingest-arxiv's
  # is not. Drift exits 3, so the check goes red when there is something to
  # apply — which is the point. An empty result stays green.
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - name: compare this repo's lineage against the template
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/drift_check.py check
