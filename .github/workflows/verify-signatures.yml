name: verify-signatures
on:
  # TEMPLATE MODE: no schedules (operator rule #10). A mold has no members
  # holding keys, and the tool exits 0 there without checking anything.
  #
  # An activated syndicate should run this on pull_request, which is where it
  # earns its place - a commit that cannot be verified should not reach main:
  #
  #   pull_request:
  #   push: {branches: [main]}
  workflow_dispatch: {}
permissions: {contents: read}
jobs:
  signatures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {fetch-depth: 0}    # the rule is about history, not the tip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install -r tools/requirements.txt
      - name: every member commit is signed by a key its author's row lists
        run: python tools/verify_signatures.py
